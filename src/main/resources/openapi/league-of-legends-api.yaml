      type: object
      description: Base pagination response metadata.
      required:
        - pageNumber
        - pageSize
        - totalElements
        - totalPages
      properties:
        pageNumber:
          type: integer
          format: int32
          description: Current page number (0-indexed).
          example: 0
        pageSize:
          type: integer
          format: int32
          description: Number of elements per page.
          example: 10
        totalElements:
          type: integer
          format: int64
          description: Total number of elements matching the criteria.
          example: 42
        totalPages:
          type: integer
          format: int32
          description: Total number of available pages.
          example: 5
